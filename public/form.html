<!DOCTYPE html>
<html>
<head><title>登録フォーム</title></head>
<body>
  <h2>ユーザー登録</h2>
  <form id="userForm">
    <label>メール: <input name="email" required></label><br>
    <label>氏名: <input name="name" required></label><br>
    <label>年齢: <input name="age" type="number" required></label><br>
    <label>趣味: <input name="hobby"></label><br>
    <button type="submit">確認画面へ</button>
  </form>
  <script src="./js/form.js"></script>
</body>
</html>
