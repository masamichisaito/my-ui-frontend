name: CI + Deploy (Frontend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME:     ${{ secrets.DB_NAME }}
      DB_HOST:     ${{ secrets.DB_HOST }}
      DB_PORT:     ${{ secrets.DB_PORT }}
      NODE_ENV: test

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm install

      - name: Start frontend (Vite) in background
        run: |
          nohup npm run dev > frontend.log 2>&1 &
          sleep 5

      - name: Clone backend repo securely
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/masamichisaito/my-api-backend.git ../my-api-backend

      - name: Install backend dependencies
        run: |
          cd ../my-api-backend
          npm install

      - name: Write .env.test for backend (Supabase)
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" > ../my-api-backend/.env.test
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> ../my-api-backend/.env.test
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> ../my-api-backend/.env.test
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> ../my-api-backend/.env.test
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> ../my-api-backend/.env.test
          echo "NODE_ENV=test" >> ../my-api-backend/.env.test

      - name: Start backend server in background
        run: |
          cd ../my-api-backend
          nohup node index.js > backend.log 2>&1 &
          sleep 5

      - name: Wait for backend (API)
        run: npx wait-on http://localhost:3000

      - name: Wait for frontend (Vite)
        run: npx wait-on http://localhost:5173

      - name: Install Cypress
        run: npx cypress install

      - name: Run Cypress E2E tests
        run: npm run test:e2e

  deploy-frontend:
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Frontend Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}
