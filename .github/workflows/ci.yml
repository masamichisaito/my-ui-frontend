name: CI + Deploy (Unified)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unified-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_test_db
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm install

      - name: Start frontend
        run: |
          nohup npm run dev > frontend.log 2>&1 &
          sleep 5

      - name: Clone backend securely
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/masamichisaito/my-api-backend.git ../my-api-backend

      - name: Install backend dependencies
        run: |
          cd ../my-api-backend
          npm install

      - name: Create backend .env.test
        run: |
          echo "DB_USERNAME=${{ secrets.SUPABASE_USERNAME }}" >> ../my-api-backend/.env.test
          echo "DB_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}" >> ../my-api-backend/.env.test
          echo "DB_NAME=${{ secrets.SUPABASE_DBNAME }}" >> ../my-api-backend/.env.test
          echo "DB_HOST=${{ secrets.SUPABASE_HOST }}" >> ../my-api-backend/.env.test
          echo "DB_PORT=${{ secrets.SUPABASE_PORT }}" >> ../my-api-backend/.env.test
          echo "NODE_ENV=test" >> ../my-api-backend/.env.test

      - name: Run backend unit tests
        run: |
          cd ../my-api-backend
          npm test

      - name: Start backend server
        run: |
          cd ../my-api-backend
          nohup node server.js > backend.log 2>&1 &
          sleep 5

      - name: Wait for backend
        run: npx wait-on http://localhost:3000

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173

      - name: Install Cypress
        run: npx cypress install

      - name: Run Cypress E2E
        run: npm run test:e2e

      - name: Show backend logs on failure
        if: failure()
        run: cat ../my-api-backend/backend.log || echo "No backend log found"

  deploy:
    needs: unified-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_FRONT_DEPLOY_HOOK_URL }}
